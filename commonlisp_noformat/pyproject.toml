[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-commonlisp-noformat"
description = "Common Lisp grammar for tree-sitter with plain string literals (no format specifier parsing)"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "commonlisp"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed"
]
requires-python = ">=3.9"
license.text = "MIT"

[project.urls]
Homepage = "https://github.com/jimwhite/tree-sitter-commonlisp"

[project.optional-dependencies]
core = ["tree-sitter~=0.21"]
